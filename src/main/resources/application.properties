spring.application.name=ms-api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=ms-usuarios-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ms-usuarios
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=ms-usuarios
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ms-usuarios
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.server.webmvc.routes[2].id=ms-excepciones
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ms-excepciones
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/excepciones/**